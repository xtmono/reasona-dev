[project]
name = "reasona-dev"
version = "0.1.0"
description = "Deterministic plan-to-PR pipeline. Bernstein orchestration substrate + the reasona finding contract."
# >=3.12, not >=3.11: `bernstein` itself requires >=3.12, so a wider floor
# here makes the project unresolvable ("No solution found ... bernstein
# cannot be used") and `uv run` fails outright -- which is why every test
# invocation had to use `--no-project`, leaving the ordinary install path
# unverified.
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "bernstein>=3.15.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Real reasona-dev CLI -- previously nonexistent, so `resolve()`'s `flag`
# parameter had no actual caller. `reasona-dev compile-plan --dev opus ...`
# is now how a flag override is actually typed.
[project.scripts]
reasona-dev = "reasona_dev.cli:main"

# Real entry-point group verified against installed Bernstein 3.15.1:
# plugins/manager.py -> entry_points(group="bernstein.plugins")
[project.entry-points."bernstein.plugins"]
reasona_dev = "reasona_dev.plugin:ReasonaGatePlugin"

# Real entry-point group verified against installed Bernstein 3.15.1:
# adapters/registry.py -> _load_entrypoint_adapters(), entry_points(group="bernstein.adapters")
# `agy` needs no entry here -- it is already a native Bernstein adapter
# (Antigravity CLI, same binary/flags dev-ralf's dispatch.md documents).
# `ocr` and `omp` were confirmed absent from the installed registry.
[project.entry-points."bernstein.adapters"]
ocr = "reasona_dev.adapters.ocr:OcrAdapter"
omp = "reasona_dev.adapters.omp:OmpAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasona_dev"]
