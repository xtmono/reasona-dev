# reasona-dev multi-lens verification pipeline.
#
# Runs on Bernstein's `review --pipeline` DSL (verified real: `bernstein review
# --pipeline review.yaml --pr N`, core/quality/review_pipeline/{schema,runner,verdict}.py,
# installed 3.15.1).
#
# `strategy: all` on the initial_review stage is the native expression of
# dev-ralf's rule "merged verdict = PASS iff ALL reviewers PASS" -- verified
# against installed source (AggregatorStrategy: any|all|majority|weighted).
# No custom merge hook needed for this piece.
#
# Findings from each agent are still expected to follow the text contract in
# reasona_dev/finding_adapter.py (MUST_FIX/ADVISORY + `||` evidence fields);
# the pipeline's own PASS/FAIL verdict is a coarse gate on TOP of that -- our
# `on_pre_task_create` hook re-parses the raw agent output through
# `finding_adapter.parse_text_contract` for the fine-grained disposition,
# recheck routing, and escalation decisions this pipeline does not itself
# know how to make.

version: 1
name: reasona-dev-initial-review
pass_threshold: 1.0
block_on_fail: true

stages:
  - name: initial_review
    parallelism: 2
    aggregator:
      strategy: all
    agents:
      - role: reviewer
        model: opus
        adapter: claude
        prompt_template: prompts/review.md
        effort: high
      - role: ocr_reviewer
        model: null           # ocr is stateless/tool-native, no LLM model slot
        adapter: ocr           # NOT a stock Bernstein adapter -- see docs/ARCHITECTURE.md §3
        prompt_template: null
        effort: null

  - name: bug_and_compliance_scan
    parallelism: 2
    aggregator:
      strategy: all
    agents:
      - role: bugbot
        model: deepseek-v4-pro
        adapter: kilo
        prompt_template: prompts/bugbot.md
        effort: high
      - role: compliance
        model: sonnet
        adapter: claude
        prompt_template: prompts/compliance.md
        effort: high
