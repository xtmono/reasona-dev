# Committed, project-local reasona_dev.model_config layer for THIS repo --
# see README "Bootstrapping this repo's own bernstein.yaml" for why a
# development repo uses this instead of relying on whatever happens to be
# in the operator's own ~/.reasona/config.yaml. reasona_dev.config_file's
# own priority (project cfg beats global cfg) means this file wins whenever
# reasona-dev tooling is run with `--workdir` pointing at this repo (or no
# `--workdir` at all, from inside it).
#
# Content mirrors the real dev-ralf env-var setup this project was ported
# from (tool:model:effort composite, same format env vars/flags/this file
# all accept identically -- reasona_dev/model_config.py).
#
# bugbot: dev-ralf ran bugbot on claude:opus:high -- NOT reasona-dev's
# hardcoded fallback (kilo adapter / deepseek-v4-pro), which only applies
# when nothing overrides it. This file is that override.
models:
  dev: claude:sonnet:high
  review: claude:opus:high,ocr
  recheck: claude:sonnet:high,ocr
  bugbot: claude:opus:high
  verify: claude:sonnet:high
  final_audit: claude:opus:high
  dev_escalation: claude:opus:high
